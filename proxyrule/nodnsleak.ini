[custom]
; 解决DNS泄露，无分流群组
; self 黑名单代理
ruleset=🚀 节点选择,https://raw.githubusercontent.com/1lkei/resources/refs/heads/main/proxyrule/self_black.list
; self 白名单直连
ruleset=DIRECT,https://raw.githubusercontent.com/1lkei/resources/refs/heads/main/proxyrule/self_white.list
; 结束
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOSITE,apple
ruleset=🚀 节点选择,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true